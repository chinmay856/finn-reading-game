<!doctype html><html><head><meta charset="utf-8"><title>Yahuh production review v2</title><style>html,body{margin:0;background:#21172b;color:#fff;font-family:system-ui,sans-serif}main{max-width:1440px;margin:0 auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:20px;margin:0}.stage{position:relative;background:#321b49;border:2px solid #ad91c4}.stage img{display:block;width:100%;height:auto}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button{pointer-events:auto;margin:12px;width:58px;height:92px;border:1px solid #fff;background:#27163dcc;color:#fff;font-size:38px}.strip{display:flex;gap:10px;overflow:auto;padding-top:12px}.thumb{min-width:215px;border:3px solid transparent;background:#4b315e;color:#fff;padding:0}.thumb.active{border-color:#f5bd47}.thumb img{display:block;width:100%}.thumb span{display:block;padding:7px;font-weight:700}</style></head><body><main><div class="head"><h1 id="title"></h1><span id="count"></span></div><div class="stage"><img id="main" alt=""><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="strip" id="strip"></div></main><script>const slides=[{"title":"Headline covers the reporting","src":"yahuh-anchor-v2_p1.png?v=6378c9bf2dd0"},{"title":"Story emerges","src":"yahuh-anchor-v2_p2.png?v=2bf0413c7897"},{"title":"Sources return","src":"yahuh-anchor-v2_p3.png?v=0442fda8813d"},{"title":"Image captions return","src":"yahuh-anchor-v2_p4.png?v=062623662903"},{"title":"Authors return","src":"yahuh-anchor-v2_p5.png?v=b096ae61f94e"},{"title":"Pictures match the stories","src":"yahuh-anchor-v2_p6.png?v=bdd8e55c8817"},{"title":"Headlines match the stories","src":"yahuh-anchor-v2_p7.png?v=30fb5ac546b6"},{"title":"Auto headline takeover","src":"yahuh-anchor-v2_p8.png?v=0a8c877cb4f4"},{"title":"Lock-in checklist","src":"yahuh-anchor-v2_p9.png?v=5dfcccaad40f"},{"title":"Pictures restored","src":"yahuh-anchor-v2_p10.png?v=940f19d6cbcc"},{"title":"Reporting restored","src":"yahuh-anchor-v2_p11.png?v=e38b1cd4e59b"},{"title":"Headlines fixed","src":"yahuh-anchor-v2_p12.png?v=a866bdca7f40"},{"title":"Repair secured","src":"yahuh-anchor-v2_p13.png?v=0351a75f45f0"}];let index=0;const main=document.querySelector('#main'),title=document.querySelector('#title'),count=document.querySelector('#count'),strip=document.querySelector('#strip');function show(next){index=(next+slides.length)%slides.length;main.src=slides[index].src;main.alt=slides[index].title;title.textContent=slides[index].title;count.textContent=(index+1)+' / '+slides.length;[...strip.children].forEach((el,i)=>el.classList.toggle('active',i===index));strip.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}slides.forEach((slide,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+slide.src+'" alt=""><span>'+slide.title+'</span>';b.onclick=()=>show(i);strip.append(b)});document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(0);</script></body></html>
