<!doctype html><html><head><meta charset="utf-8"><title>ThreadIt production review v2</title><style>html,body{margin:0;background:#15252f;color:#fff;font-family:system-ui,sans-serif}main{max-width:1440px;margin:0 auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:20px;margin:0}.stage{position:relative;background:#0c3944;border:2px solid #8db4bd}.stage img{display:block;width:100%;height:auto}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button{pointer-events:auto;margin:12px;width:58px;height:92px;border:1px solid #fff;background:#0b2f3dcc;color:#fff;font-size:38px}.strip{display:flex;gap:10px;overflow:auto;padding-top:12px}.thumb{min-width:215px;border:3px solid transparent;background:#244b55;color:#fff;padding:0}.thumb.active{border-color:#ff9d00}.thumb img{display:block;width:100%}.thumb span{display:block;padding:7px;font-weight:700}</style></head><body><main><div class="head"><h1 id="title"></h1><span id="count"></span></div><div class="stage"><img id="main" alt=""><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="strip" id="strip"></div></main><script>const slides=[{"title":"Echo chamber detected","src":"threadit-anchor-v2_p1.png?v=89e7c9135533"},{"title":"Comment path untangled","src":"threadit-anchor-v2_p2.png?v=4a5a755217f5"},{"title":"Original post and votes revealed","src":"threadit-anchor-v2_p3.png?v=b8db4b315394"},{"title":"Copied comments identified","src":"threadit-anchor-v2_p4.png?v=1fb5dcd40677"},{"title":"Copied comments collapsed","src":"threadit-anchor-v2_p5.png?v=1c394bde5ce8"},{"title":"Disagreement restored","src":"threadit-anchor-v2_p6.png?v=2ff2d6dd3c16"},{"title":"Community rules restored","src":"threadit-anchor-v2_p7.png?v=a8722075ab47"},{"title":"Auto consensus override","src":"threadit-anchor-v2_p8.png?v=b9e6a0458791"},{"title":"Lock-in checklist","src":"threadit-anchor-v2_p9.png?v=74f3a06423ee"},{"title":"Human post restored","src":"threadit-anchor-v2_p10.png?v=5778580983f8"},{"title":"Sources counted","src":"threadit-anchor-v2_p11.png?v=972168be7dc6"},{"title":"Context locked","src":"threadit-anchor-v2_p12.png?v=375c8d43724f"},{"title":"Questions locked","src":"threadit-anchor-v2_p13.png?v=fb98b4f497cc"},{"title":"Repair secured","src":"threadit-anchor-v2_p14.png?v=add3a542e237"}];let index=0;const main=document.querySelector('#main'),title=document.querySelector('#title'),count=document.querySelector('#count'),strip=document.querySelector('#strip');function show(next){index=(next+slides.length)%slides.length;main.src=slides[index].src;main.alt=slides[index].title;title.textContent=slides[index].title;count.textContent=(index+1)+' / '+slides.length;[...strip.children].forEach((el,i)=>el.classList.toggle('active',i===index));strip.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}slides.forEach((slide,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+slide.src+'" alt=""><span>'+slide.title+'</span>';b.onclick=()=>show(i);strip.append(b)});document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(0);</script></body></html>
