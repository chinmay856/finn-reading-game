<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FacePlace complete screen review</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111820;color:#f4f7f8;overflow:hidden}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#17232d}h1{margin:0;font-size:18px}#counter{color:#aab8c2}main{height:calc(100vh - 116px);display:grid;place-items:center;padding:12px 78px}img{display:block;max-width:100%;max-height:100%;border:1px solid #526572;box-shadow:0 12px 38px #0009}button{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:86px;border:1px solid #78909c;background:#263b49e8;color:#fff;font-size:34px;cursor:pointer}#previous{left:12px}#next{right:12px}footer{height:62px;display:flex;gap:10px;align-items:center;justify-content:flex-start;overflow-x:auto;padding:8px 12px;background:#17232d}footer button{position:static;transform:none;flex:0 0 auto;width:auto;height:auto;padding:8px 14px;font-size:13px;border-radius:4px}footer button[aria-current=true]{outline:3px solid #ffad22}</style></head>
<body><header><h1 id="title"></h1><span id="counter"></span></header><main><img id="frame" alt=""></main><button id="previous" aria-label="Previous screen">‹</button><button id="next" aria-label="Next screen">›</button><footer id="tabs"></footer><script>
const screens=[["Selected slice","faceplace-anchor-v2_p1.png"],["Original comments restored","faceplace-anchor-v2_p2.png"],["Helper revealed","faceplace-anchor-v2_p3.png"],["Gear and cleanup revealed","faceplace-anchor-v2_p4.png"],["Other fish revealed","faceplace-anchor-v2_p5.png"],["Whole story restored","faceplace-anchor-v2_p6.png"],["Auto-enhanced over-fix","faceplace-anchor-v2_p7.png"],["Lock-in checklist","faceplace-anchor-v2_p8.png"],["Original comments locked","faceplace-anchor-v2_p9.png"],["Album photos restored","faceplace-anchor-v2_p10.png"],["Original photo restored","faceplace-anchor-v2_p11.png"],["Accurate words locked","faceplace-anchor-v2_p12.png"],["Awesomeness score removed","faceplace-anchor-v2_p13.png"],["Repair secured","faceplace-anchor-v2_p14.png"]];let index=0;const frame=document.querySelector("#frame"),title=document.querySelector("#title"),counter=document.querySelector("#counter"),tabs=document.querySelector("#tabs");function render(){title.textContent=screens[index][0];counter.textContent=`${index+1} / ${screens.length}`;frame.src=screens[index][1]+"?v=5-auto-album";frame.alt=screens[index][0];[...tabs.children].forEach((button,position)=>{button.setAttribute("aria-current",position===index);if(position===index)button.scrollIntoView({block:"nearest",inline:"center"})})}screens.forEach(([label],position)=>{const button=document.createElement("button");button.textContent=label;button.addEventListener("click",()=>{index=position;render()});tabs.append(button)});function move(step){index=(index+step+screens.length)%screens.length;render()}document.querySelector("#previous").addEventListener("click",()=>move(-1));document.querySelector("#next").addEventListener("click",()=>move(1));addEventListener("keydown",event=>{if(event.key==="ArrowLeft")move(-1);if(event.key==="ArrowRight")move(1)});render();
</script></body></html>
