<!doctype html><html><head><meta charset="utf-8"><title>Search-ish v2 story review</title><style>html,body{margin:0;background:#15252f;color:#fff;font-family:system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;margin-bottom:12px}h1{font-size:20px;margin:0}.stage{position:relative;border:2px solid #8db4bd}.stage img{display:block;width:100%}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button{pointer-events:auto;margin:12px;width:58px;height:92px;background:#0b2f3dcc;color:white;border:1px solid white;font-size:38px}.strip{display:flex;gap:10px;overflow:auto;padding-top:12px}.thumb{min-width:215px;background:#244b55;color:white;border:3px solid transparent;padding:0}.thumb.active{border-color:#ff9d00}.thumb img{display:block;width:100%}.thumb span{display:block;padding:7px;font-weight:700}</style></head><body><main><div class="head"><h1 id="title"></h1><span id="count"></span></div><div class="stage"><img id="main"><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="strip" id="strip"></div></main><script>const slides=[{"title":"Initial hierarchy corruption","src":"searchish-story-v2_p1.png"},{"title":"Useful search hierarchy restored","src":"searchish-story-v2_p2.png"},{"title":"Chinmay proposes a shortcut","src":"searchish-story-v2_p3.png"},{"title":"AI completes the search for Finn","src":"searchish-story-v2_p4.png"},{"title":"Lock-in repair order","src":"searchish-story-v2_p5.png"}];let index=0;const main=document.querySelector('#main'),title=document.querySelector('#title'),count=document.querySelector('#count'),strip=document.querySelector('#strip');function show(n){index=(n+slides.length)%slides.length;main.src=slides[index].src;title.textContent=slides[index].title;count.textContent=(index+1)+' / '+slides.length;[...strip.children].forEach((e,i)=>e.classList.toggle('active',i===index));strip.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}slides.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+s.src+'"><span>'+s.title+'</span>';b.onclick=()=>show(i);strip.append(b)});prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(0)</script></body></html>
