<!doctype html><html><head><meta charset="utf-8"><title>ViewTube production review v2</title><style>html,body{margin:0;background:#15252f;color:#fff;font-family:system-ui,sans-serif}main{max-width:1440px;margin:0 auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:20px;margin:0}.stage{position:relative;background:#0c3944;border:2px solid #8db4bd}.stage img{display:block;width:100%;height:auto}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button{pointer-events:auto;margin:12px;width:58px;height:92px;border:1px solid #fff;background:#0b2f3dcc;color:#fff;font-size:38px}.strip{display:flex;gap:10px;overflow:auto;padding-top:12px}.thumb{min-width:215px;border:3px solid transparent;background:#244b55;color:#fff;padding:0}.thumb.active{border-color:#ff9d00}.thumb img{display:block;width:100%}.thumb span{display:block;padding:7px;font-weight:700}</style></head><body><main><div class="head"><h1 id="title"></h1><span id="count"></span></div><div class="stage"><img id="main" alt=""><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="strip" id="strip"></div></main><script>const slides=[{"title":"Forced viral feed","src":"viewtube-anchor-v2_p1.png?v=4e51ce9f39df"},{"title":"Finn's search restored","src":"viewtube-anchor-v2_p2.png?v=72e793861207"},{"title":"Excessive ads removed","src":"viewtube-anchor-v2_p3.png?v=ff7f3f2bda42"},{"title":"Views and comments restored","src":"viewtube-anchor-v2_p4.png?v=fcaa16ae7fbc"},{"title":"Autoplay choice restored","src":"viewtube-anchor-v2_p5.png?v=f70a682932b5"},{"title":"Finn selects his video","src":"viewtube-anchor-v2_p6.png?v=6d7e628f0b57"},{"title":"Auto Show over-fix","src":"viewtube-anchor-v2_p7.png?v=74d897561ca1"},{"title":"Lock in the repair","src":"viewtube-anchor-v2_p8.png?v=25d19e4d636a"},{"title":"Finn's search locked","src":"viewtube-anchor-v2_p9.png?v=9e92cfb18c99"},{"title":"Excessive ads locked out","src":"viewtube-anchor-v2_p10.png?v=f8aa13ebf7fa"},{"title":"Views and comments locked","src":"viewtube-anchor-v2_p11.png?v=3d9884bbc3b7"},{"title":"Autoplay permission locked","src":"viewtube-anchor-v2_p12.png?v=32ffcf679c9b"},{"title":"Finn's choice locked","src":"viewtube-anchor-v2_p13.png?v=16fcd742bd63"},{"title":"Repair secured","src":"viewtube-anchor-v2_p14.png?v=5ed54a36b1a4"}];let index=0;const main=document.querySelector('#main'),title=document.querySelector('#title'),count=document.querySelector('#count'),strip=document.querySelector('#strip');function show(next){index=(next+slides.length)%slides.length;main.src=slides[index].src;main.alt=slides[index].title;title.textContent=slides[index].title;count.textContent=(index+1)+' / '+slides.length;[...strip.children].forEach((el,i)=>el.classList.toggle('active',i===index));strip.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}slides.forEach((slide,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+slide.src+'" alt=""><span>'+slide.title+'</span>';b.onclick=()=>show(i);strip.append(b)});document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(0);</script></body></html>
