  <style>
    text{font-family:"Chalkboard SE","Comic Sans MS",sans-serif}.title{fill:#fff;font-size:20px;font-weight:700;letter-spacing:1px}.ui{fill:#f1f0e9;font-size:20px;font-weight:700}.small{fill:#f1f0e9;font-size:14px;font-weight:700}.dark{fill:#17242b}.muted{fill:#778087}.reading{fill:#17242b;font-size:22px}.nav{fill:#dfe4df;font-size:16px}.heading{fill:#fff;font-size:25px;font-weight:700}.lime{fill:#a8dd19}.pink{fill:#ee347f}.meta{fill:#aeb7b1;font-size:13px}.cardTitle{fill:#fff;font-size:16px;font-weight:700}.body{fill:#dfe4df;font-size:14px}.label{fill:#a8dd19;font-size:13px;font-weight:700;letter-spacing:.7px}
  </style>

