<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="1440" height="900" viewBox="0 0 1440 900">
  <sodipodi:namedview pagecolor="#c8c8c8">
    <inkscape:page x="0" y="0" width="1440" height="900" inkscape:label="Spotty-Fi corrupted"/>
    <inkscape:page x="1540" y="0" width="1440" height="900" inkscape:label="Spotty-Fi repaired"/>
  </sodipodi:namedview>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087f86"/><stop offset="1" stop-color="#005c63"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#073c70"/><stop offset="1" stop-color="#00598f"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f12d96"/><stop offset="1" stop-color="#8d185e"/></linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#ee347f" stroke-opacity=".35" stroke-width="3"/></pattern>
    <pattern id="corruptHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#ef3b3b" stroke-opacity=".42" stroke-width="3"/></pattern>
    <g id="buttons"><rect width="25" height="23" fill="#d5d4cc" stroke="#fff"/><path d="M2 21h21V2" fill="none" stroke="#555" stroke-width="2"/></g>
    <g id="spottyMark"><rect width="42" height="28" rx="7" fill="#a8dd19"/><circle cx="15" cy="14" r="8" fill="#111"/><circle cx="29" cy="14" r="8" fill="#e92d8a"/><circle cx="15" cy="14" r="3" fill="#a8dd19"/><circle cx="29" cy="14" r="3" fill="#111"/></g>
    <g id="sharedShell">
      <rect width="1440" height="900" fill="url(#desk)"/>
      <rect x="0" y="850" width="1440" height="50" fill="#d7d5cc" stroke="#fff" stroke-width="2"/>
      <rect x="10" y="858" width="105" height="34" fill="#e3e1d8" stroke="#4c5354"/><text x="62" y="882" text-anchor="middle" class="ui dark">START</text>
      <rect x="128" y="858" width="210" height="34" fill="#c9c8c0" stroke="#606666"/><use href="#spottyMark" x="140" y="861" transform="scale(.75)"/><text x="182" y="882" class="small dark">SPOTTY-FI</text>
      <rect x="348" y="858" width="230" height="34" fill="#c9c8c0" stroke="#606666"/><text x="463" y="882" text-anchor="middle" class="small dark">READING COMPANION</text>
      <text x="720" y="882" text-anchor="middle" class="small dark">INTERNET RECOVERY OS</text><text x="1370" y="882" text-anchor="end" class="small dark">10:24 AM</text>
      <g>
        <rect x="20" y="20" width="900" height="815" rx="5" fill="#101413" stroke="#c9c8c0" stroke-width="4"/>
        <rect x="24" y="24" width="892" height="38" fill="url(#bar)"/><use href="#spottyMark" x="34" y="29"/><text x="88" y="51" class="title">SPOTTY-FI — DISCOVERY</text>
        <use href="#buttons" x="823" y="31"/><use href="#buttons" x="853" y="31"/><use href="#buttons" x="883" y="31"/><path d="m890 37 13 13m0-13-13 13" stroke="#222" stroke-width="2"/>
      </g>
      <g>
        <rect x="940" y="20" width="480" height="815" rx="5" fill="#f4f2eb" stroke="#c9c8c0" stroke-width="4"/>
        <rect x="944" y="24" width="472" height="38" fill="url(#bar)"/><text x="960" y="51" class="title">READING COMPANION</text>
        <use href="#buttons" x="1323" y="31"/><use href="#buttons" x="1353" y="31"/><use href="#buttons" x="1383" y="31"/><path d="m1390 37 13 13m0-13-13 13" stroke="#222" stroke-width="2"/>
        <text x="970" y="112" class="reading">Reading passage appears here.</text><text x="970" y="150" class="reading">The site changes only after Finn</text><text x="970" y="188" class="reading">finishes, checks comprehension,</text><text x="970" y="226" class="reading">and reviews the results.</text>
        <text x="970" y="580" class="small dark">PASSAGE PROGRESS</text><rect x="970" y="596" width="410" height="18" fill="#eceae3" stroke="#46617a"/>
        <rect x="955" y="654" width="450" height="150" fill="#e5e3dc" stroke="#2b5278"/><rect x="955" y="654" width="450" height="34" fill="#07558b"/><text x="970" y="678" class="small">QUICK CHECK — OPENS AFTER READING</text><text x="1180" y="746" text-anchor="middle" class="small muted">RESULTS APPEAR AFTER THE QUICK CHECK</text>
      </g>
    </g>
