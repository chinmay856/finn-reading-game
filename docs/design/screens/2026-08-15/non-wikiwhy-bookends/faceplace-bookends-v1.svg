    <g transform="translate(180 165)"><rect width="548" height="526" rx="7" fill="#fff" stroke="#2F8A49"/><text x="16" y="27" class="label">Tyler K.</text><text x="16" y="47" class="tiny">Yesterday at 5:08 PM · Public</text><text x="16" y="78" class="caption">“I CAUGHT THIS ONE!”</text><text x="16" y="103" class="body green">The happy moment stays. The wider frame adds context.</text><g transform="translate(14 118)" clip-path="url(#photoClip)"><image href="faceplace-fishing-wide-v1.jpg" x="0" y="0" width="588" height="330" preserveAspectRatio="xMidYMid meet"/></g><rect x="14" y="118" width="520" height="330" rx="4" fill="none" stroke="#2F8A49" stroke-width="3"/><text x="16" y="478" class="body blue">♥  Like     Comment     Share</text><text x="424" y="478" class="tiny">482 reactions</text><rect x="14" y="494" width="520" height="24" fill="#e0f0e3"/><text x="26" y="511" class="tiny green">SAME PHOTO VIEWPORT · WIDER SCENE · ORIGINAL JOY KEPT</text></g>
    <g transform="translate(744 165)"><rect width="132" height="526" rx="6" fill="#fff" stroke="#d5d8dd"/><text x="12" y="30" class="label">CONTEXT</text><text x="12" y="58" class="tiny green">Genuine joy</text><text x="12" y="84" class="tiny green">Helpers visible</text><text x="12" y="110" class="tiny green">Scale restored</text><rect x="10" y="136" width="112" height="104" fill="#e0f0e3" stroke="#2F8A49"/><text x="20" y="166" class="tiny green">ONE MOMENT</text><text x="20" y="194" class="tiny green">MORE CONTEXT</text><text x="20" y="222" class="tiny green">NO COMPARISON</text><line x1="10" y1="266" x2="122" y2="266" stroke="#d5d8dd"/><text x="12" y="294" class="label">VISIBLE NOW</text><text x="12" y="320" class="tiny">helpers</text><text x="12" y="340" class="tiny">stocked tank</text><text x="12" y="360" class="tiny">tangled gear</text><text x="12" y="380" class="tiny">cleanup</text></g>
    <g transform="translate(18 716)"><text x="0" y="24" class="meter green">HONESTY METER</text><text x="150" y="24" class="meter green">BANANA%</text><rect x="0" y="38" width="858" height="24" fill="#e0f0e3" stroke="#2F8A49"/><rect x="0" y="38" width="858" height="24" fill="#2F8A49"/></g>
