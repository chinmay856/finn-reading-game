<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="900" height="815" viewBox="0 0 900 815">
  <sodipodi:namedview pagecolor="#c8c8c8"><inkscape:page x="0" y="0" width="900" height="815" inkscape:label="FacePlace corrupted site"/><inkscape:page x="1000" y="0" width="900" height="815" inkscape:label="FacePlace repaired site"/></sodipodi:namedview>
  <defs>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#063b6c"/><stop offset="1" stop-color="#005589"/></linearGradient>
    <pattern id="redHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#C5251E" stroke-opacity=".24" stroke-width="3"/></pattern>
    <clipPath id="photoClip"><rect width="520" height="330" rx="4"/></clipPath>
    <g id="windowButton"><rect width="26" height="23" fill="#d9d7cf" stroke="#fff"/><path d="M2 21h22V2" fill="none" stroke="#555" stroke-width="2"/></g>
    <g id="personIcon"><circle cx="10" cy="8" r="6" fill="#fff"/><path d="M1 24c0-7 4-11 9-11s9 4 9 11" fill="#fff"/></g>
    <g id="shell">
      <rect width="900" height="815" fill="#eeeae1"/><rect x="2" y="2" width="896" height="811" rx="5" fill="#f4f5f7" stroke="#c7c5bd" stroke-width="4"/>
      <rect x="4" y="4" width="892" height="40" fill="url(#browser)"/><text x="20" y="31" class="browserTitle">www.face-place.net</text><use href="#windowButton" x="802" y="11"/><use href="#windowButton" x="832" y="11"/><use href="#windowButton" x="862" y="11"/><path d="m868 16 15 14m0-14-15 14" stroke="#222" stroke-width="2"/>
      <rect x="4" y="44" width="892" height="67" fill="#315caa"/><rect x="20" y="58" width="38" height="38" rx="7" fill="#fff"/><text x="39" y="88" text-anchor="middle" class="mark">f</text><text x="70" y="86" class="siteLogo">faceplace</text><rect x="300" y="59" width="330" height="38" rx="18" fill="#fff"/><text x="324" y="83" class="small muted">Search FacePlace</text><use href="#personIcon" x="760" y="62"/><circle cx="826" cy="77" r="16" fill="#fff" opacity=".95"/><text x="826" y="83" text-anchor="middle" class="label blue">•••</text>
      <rect x="4" y="111" width="892" height="38" fill="#fff" stroke="#d4d7dc"/><text x="24" y="136" class="small">Home</text><text x="92" y="136" class="small">Friends</text><text x="168" y="136" class="small">Photos</text><text x="240" y="136" class="small">Messages</text>
    </g>
  </defs>
  <style>text{font-family:"Chalkboard SE","Comic Sans MS",sans-serif}.browserTitle{fill:#fff;font-size:20px;font-weight:700}.siteLogo{fill:#fff;font-size:26px;font-weight:700}.mark{fill:#315caa;font-size:34px;font-weight:700}.heading{font-size:22px;font-weight:700;fill:#172d40}.label{font-size:13px;font-weight:700}.body{font-size:14px;fill:#27373c}.small{font-size:13px;fill:#34444d}.tiny{font-size:11px;fill:#596267}.muted{fill:#78828a}.red{fill:#C5251E}.green{fill:#2F8A49}.blue{fill:#315caa}.meter{font-size:15px;font-weight:700}.caption{font-size:19px;font-weight:700;fill:#172d40}</style>

  <g inkscape:groupmode="layer" inkscape:label="FacePlace corrupted site">
