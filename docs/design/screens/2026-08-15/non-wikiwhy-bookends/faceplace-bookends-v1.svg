    <g transform="translate(180 165)"><rect width="548" height="526" rx="7" fill="#fff" stroke="#C5251E"/><text x="16" y="27" class="label">Tyler K.</text><text x="16" y="47" class="tiny">Yesterday at 5:08 PM · Public</text><text x="16" y="78" class="caption red">“LEGENDARY FISH! SOLO WILDERNESS MASTER!”</text><text x="16" y="103" class="body">Original caption: “I CAUGHT THIS ONE!”</text><g transform="translate(14 118)" clip-path="url(#photoClip)"><image href="faceplace-fishing-wide-v1.jpg" x="-205" y="-30" width="930" height="523" preserveAspectRatio="xMidYMid meet"/></g><rect x="14" y="118" width="520" height="330" rx="4" fill="none" stroke="#C5251E" stroke-width="3"/><text x="16" y="478" class="body blue">♥  Like     Comment     Share</text><text x="424" y="478" class="tiny">1.2K reactions</text><rect x="14" y="494" width="520" height="24" fill="url(#redHatch)"/><text x="26" y="511" class="tiny red">AI ADDED A WHOLE LIFE STORY TO ONE PHOTO</text></g>
    <g transform="translate(744 165)"><rect width="132" height="526" rx="6" fill="#fff" stroke="#d5d8dd"/><text x="12" y="30" class="label">COMPARE</text><text x="12" y="58" class="tiny red">Most awesome life</text><text x="12" y="84" class="tiny red">Best day ever</text><text x="12" y="110" class="tiny red">No help needed</text><rect x="10" y="136" width="112" height="104" fill="url(#redHatch)" stroke="#C5251E"/><text x="20" y="166" class="tiny red">AVOCADO 83%</text><text x="20" y="194" class="tiny red">BANANA 14%</text><text x="20" y="222" class="tiny red">HONESTY ???</text><line x1="10" y1="266" x2="122" y2="266" stroke="#d5d8dd"/><text x="12" y="294" class="label">THE AI SAYS</text><text x="12" y="320" class="tiny red">This one post</text><text x="12" y="338" class="tiny red">explains Tyler's</text><text x="12" y="356" class="tiny red">entire life.</text></g>
    <g transform="translate(18 716)"><text x="0" y="24" class="meter red">HONESTY METER</text><text x="150" y="24" class="meter red">AVOCADO%</text><rect x="0" y="38" width="858" height="24" fill="url(#redHatch)" stroke="#C5251E"/></g>
  </g>

