<!doctype html><html><head><meta charset="utf-8"><title>MyCorner production review v3</title><style>html,body{margin:0;background:#1e3040;color:#fff;font-family:system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;margin-bottom:12px}h1{font-size:22px;margin:0}.stage{position:relative;border:2px solid #7da7c8}.stage img{display:block;width:100%}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button{pointer-events:auto;margin:12px;width:58px;height:92px;border:1px solid #fff;background:#173a62cc;color:#fff;font-size:38px}.strip{display:flex;gap:10px;overflow:auto;padding-top:12px}.thumb{min-width:215px;border:3px solid transparent;background:#315c70;color:#fff;padding:0}.thumb.active{border-color:#ff9d00}.thumb img{display:block;width:100%}.thumb span{display:block;padding:7px;font-weight:700}</style></head><body><main><div class="head"><h1 id="title"></h1><span id="count"></span></div><div class="stage"><img id="main" alt=""><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="strip" id="strip"></div></main><script>const slides=[{"title":"Impersonator profile","src":"mycorner-anchor-v3_p1.png"},{"title":"Profile details restored","src":"mycorner-anchor-v3_p2.png"},{"title":"Latest bulletins restored","src":"mycorner-anchor-v3_p3.png"},{"title":"Profile blurbs restored","src":"mycorner-anchor-v3_p4.png"},{"title":"Known Amy profile restored","src":"mycorner-anchor-v3_p5.png"},{"title":"Auto makes the profile consistent","src":"mycorner-anchor-v3_p6.png"},{"title":"Lock in identity checks","src":"mycorner-anchor-v3_p7.png"},{"title":"Identity details checked","src":"mycorner-anchor-v3_p8.png"},{"title":"Account history checked","src":"mycorner-anchor-v3_p9.png"},{"title":"Known contact route verified","src":"mycorner-anchor-v3_p10.png"},{"title":"Money request flagged","src":"mycorner-anchor-v3_p11.png"},{"title":"Identity repair secured","src":"mycorner-anchor-v3_p12.png"}];let index=0;const main=document.querySelector('#main'),title=document.querySelector('#title'),count=document.querySelector('#count'),strip=document.querySelector('#strip');function show(next){index=(next+slides.length)%slides.length;main.src=slides[index].src+'?v=20260823-mycorner-production-v8';main.alt=slides[index].title;title.textContent=slides[index].title;count.textContent=(index+1)+' / '+slides.length;[...strip.children].forEach((el,i)=>el.classList.toggle('active',i===index));strip.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}slides.forEach((slide,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+slide.src+'?v=20260823-mycorner-production-v8" alt=""><span>'+slide.title+'</span>';b.onclick=()=>show(i);strip.append(b)});document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);addEventListener('keydown',event=>{if(event.key==='ArrowLeft')show(index-1);if(event.key==='ArrowRight')show(index+1)});show(0);</script></body></html>
