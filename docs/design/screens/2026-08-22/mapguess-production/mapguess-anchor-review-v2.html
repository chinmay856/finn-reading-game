<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MapGuess full sequence review</title><style>html,body{margin:0;background:#15252f;color:#fff;font-family:system-ui,sans-serif}main{max-width:1440px;margin:0 auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:22px;margin:0}.stage{position:relative;background:#0c3944;border:2px solid #8db4bd}.stage img{display:block;width:100%;height:auto}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav button{pointer-events:auto;margin:12px;width:58px;height:92px;border:1px solid #fff;background:#0b2f3dcc;color:#fff;font-size:38px}.strip{display:flex;gap:10px;overflow:auto;padding-top:12px}.thumb{min-width:215px;border:3px solid transparent;background:#244b55;color:#fff;padding:0}.thumb.active{border-color:#ff9d00}.thumb img{display:block;width:100%}.thumb span{display:block;padding:7px;font-weight:700}</style></head><body><main><div class="head"><h1 id="title"></h1><span id="count"></span></div><div class="stage"><img id="main" alt=""><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="strip" id="strip"></div></main><script>const slides=[{"title":"Sponsored detour","src":"mapguess-anchor-v2_p1.png"},{"title":"Irrelevant sponsored areas cleared","src":"mapguess-anchor-v2_p2.png"},{"title":"Map labels restored","src":"mapguess-anchor-v2_p3.png"},{"title":"Travel time corrected","src":"mapguess-anchor-v2_p4.png"},{"title":"Library destination restored","src":"mapguess-anchor-v2_p5.png"},{"title":"Auto moves the library","src":"mapguess-anchor-v2_p6.png"},{"title":"Try to lock the library","src":"mapguess-anchor-v2_p7.png"},{"title":"The first lock fails","src":"mapguess-anchor-v2_p8.png"},{"title":"The library moves downtown","src":"mapguess-anchor-v2_p9.png"},{"title":"The second lock fails","src":"mapguess-anchor-v2_p10.png"},{"title":"The library moves to the Presidio","src":"mapguess-anchor-v2_p11.png"},{"title":"The third lock fails","src":"mapguess-anchor-v2_p12.png"},{"title":"One final try","src":"mapguess-anchor-v2_p13.png"},{"title":"Library destination secured","src":"mapguess-anchor-v2_p14.png"},{"title":"Map repair secured","src":"mapguess-anchor-v2_p15.png"}];let index=0;const main=document.querySelector('#main'),title=document.querySelector('#title'),count=document.querySelector('#count'),strip=document.querySelector('#strip');function show(next){index=(next+slides.length)%slides.length;main.src=slides[index].src+'?v=20260822-mapguess-single-repair-v5';main.alt=slides[index].title;title.textContent=slides[index].title;count.textContent=(index+1)+' / '+slides.length;[...strip.children].forEach((el,i)=>el.classList.toggle('active',i===index));strip.children[index]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}slides.forEach((slide,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+slide.src+'?v=20260822-mapguess-single-repair-v5" alt=""><span>'+slide.title+'</span>';b.onclick=()=>show(i);strip.append(b)});document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});show(0);</script></body></html>
