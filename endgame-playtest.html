<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f88">
  <title>Internet Recovery 98 — Desktop Incident</title>
  <link rel="stylesheet" href="/endgame-playtest.css">
</head>
<body>
  <header class="playtest-toolbar" aria-label="Diagnostic controls">
    <div class="playtest-identity"><strong>DIAGNOSTICS</strong><span>Jump, skip, motion, and reset stay outside the game screen</span></div>
    <label for="jumpToBeat">Jump to beat</label>
    <select id="jumpToBeat">
      <option value="endgame_ready">1 · 10/10 complete</option>
      <option value="endgame_desktop_corrupted">2 · Desktop corrupted</option>
      <option value="endgame_popup_swarm">3 · Pop-up swarm</option>
      <option value="endgame_instruction_intro">4 · Builder introduction</option>
      <option value="endgame_lesson_lock">5 · Lesson puzzles</option>
      <option value="endgame_final_instruction">6 · Final instruction</option>
      <option value="endgame_desktop_restored">7 · Desktop restored</option>
      <option value="endgame_techno_celebration">8 · Techno celebration</option>
      <option value="endgame_complete">9 · Techno finale</option>
    </select>
    <button id="skipCurrentStep" type="button">Skip current step</button>
    <label class="motion-toggle"><input id="reduceMotion" type="checkbox"> Reduced motion</label>
    <button id="resetPlaytest" type="button">Reset endgame</button>
    <span id="playtestSaveStatus" class="playtest-save-status" role="status">Endgame ready</span>
  </header>
  <main id="stageShell" class="stage-shell">
    <section id="endgameStage" class="endgame-stage" aria-label="Internet Recovery 98 desktop incident"></section>
  </main>
  <div id="endgameAnnouncement" class="visually-hidden" aria-live="polite"></div>
  <script type="module" src="/endgame-playtest.js"></script>
</body>
</html>
